name: Professional QA Pipeline

on: [push, pull_request]

jobs:
  # JOB 1: THE BUILD
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Build Script
        # Even if you don't have a complex build, this checks for syntax errors
        run: node -c insurance.js 

  # JOB 2: THE TESTS (Only runs if Build succeeds)
  test:
    needs: build # <--- This links the jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Insurance Logic Tests
        run: npm test -- --verbose

  # JOB 3: THE LINTER (Checks for "Clean Code" / Formatting)
  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Formatting
        # This is a placeholder for a tool like ESLint
        run: echo "Checking code style... No issues found."